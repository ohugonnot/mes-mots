name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  porte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts : l'installation se bloque sinon sur les scripts post-installation
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx vitest run
